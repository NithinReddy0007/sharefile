name: Deploy Qshare Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build
        env:
          VITE_BASE_PATH: /sharefile/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp frontend/dist/index.html frontend/dist/404.html

      # 1. Deploy to gh-pages branch (works immediately out of the box with standard branch deployment)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true

      # 2. Also upload artifact and deploy directly if repository is set to GitHub Actions source
      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        if: steps.setup_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
